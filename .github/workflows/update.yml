# Actualización programada: corre el pipeline contra los sitios reales,
# guarda la base (historial de precios) en el repo y publica el sitio en GitHub Pages.
name: actualizar-sitio

on:
  schedule:
    - cron: "0 9 * * *"      # todos los días 09:00 UTC (03:00 Costa Rica)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-sitio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Pipeline (modo vivo, paralelo)
        run: python -m radar run --source live --mode parallel --discover

      - name: Guardar historial en el repo
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/radar.db
          git commit -m "datos: actualización $(date -u +%F)" || echo "sin cambios"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
