<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del juego · Radar de Ofertas</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#6ea0ff" stroke-width="2"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#6ea0ff" stroke-opacity=".55" stroke-width="2"/><path d="M16 16 L16 2 A14 14 0 0 1 29.3 11.7 Z" fill="#6ea0ff" fill-opacity=".35"/><circle cx="16" cy="16" r="2.5" fill="#6ea0ff"/><circle cx="23" cy="9.5" r="2" fill="#22c55e"/></svg>
      Radar de Ofertas
    </a>
    <nav class="mainnav" aria-label="Principal"><a href="index.html">Ofertas</a><a href="metrics.html">Métricas</a></nav>
    <span class="updated"></span>
  </div>
</header>
<main id="main"><p>Cargando…</p></main>
<footer>Precios en USD. Cada precio enlaza a la tienda donde se obtuvo.</footer>
<script src="app.js"></script>
<script>
const FORMATS = { digital: "Digital", physical: "Físico" };

function durationText(d) {
  if (!d) return "—";
  const source = d.source === "igdb" ? "IGDB" : "How Long To Beat";
  return `Historia ${d.main_h ?? "—"} h · Con extras ${d.plus_h ?? "—"} h · Completista ${d.comp_h ?? "—"} h <span class="meta">(${source})</span>`;
}

function ratingsHtml(ratings) {
  if (!ratings.length) return "—";
  return `<div class="ratings">${ratings.map(r =>
    `<span>${stars(r.score, r.source)} <span class="source">${esc(SOURCE_NAMES[r.source] || r.source)}</span></span>`).join("")}</div>`;
}

function staleHtml(statuses) {
  const stale = statuses.filter(s => !s.ok);
  if (!stale.length) return "";
  const items = stale.map(s => `${esc(s.source)} (último dato: ${s.last_ok ? fmtDate(s.last_ok) : "nunca"})`).join(", ");
  return `<p><span class="tag stale">Fuentes sin actualizar: ${items}</span></p>`;
}

function offerRow(o) {
  return `<tr><td><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.store)}</a></td>
    <td><b>${money(o.price, o.currency)}</b></td><td>${o.regular ? money(o.regular, o.currency) : "—"}</td>
    <td>${esc(FORMATS[o.format] || o.format)}</td><td>${esc(o.platform ?? "")}</td><td>${fmtDate(o.observed_at)}</td></tr>`;
}

function render(g) {
  document.title = `${g.title} · Radar de Ofertas`;
  const low = g.historic_low ? `<span class="tag low">mínimo histórico</span>` : "";
  document.getElementById("main").innerHTML = `
    <div class="detail">
      <div class="thumb" data-title="${esc(g.title)}"><img src="${esc(g.image)}" alt=""></div>
      <div class="facts">
        <h2>${esc(g.title)}</h2>
        <div class="chips">${g.platforms.map(p => `<span class="chip">${esc(p)}</span>`).join("")}</div>
        <div class="best">${priceBox(g.best_price, g.regular, g.discount_pct)}<span>en <b>${esc(g.best_store)}</b></span>${low}</div>
        <div class="meta">MSRP ${money(g.msrp)} · Lanzamiento: ${esc(g.release_date ?? "—")}</div>
        <div>${ratingsHtml(g.ratings)}</div>
        <div><b>Duración:</b> ${durationText(g.duration)}</div>
        ${staleHtml(g.source_status)}
      </div>
    </div>
    <h3>Precios por tienda</h3>
    <div class="table-wrap"><table><thead><tr><th>Tienda</th><th>Precio</th><th>Regular</th><th>Formato</th><th>Plataforma</th><th>Obtenido</th></tr></thead><tbody>${g.offers.map(offerRow).join("")}</tbody></table></div>
    <h3>Historial de precios</h3>
    <div class="chart-box"><canvas id="hist" height="110"></canvas></div>`;

  const byStore = {};
  g.history.forEach(h => (byStore[h.store] ??= []).push({ x: h.observed_at, y: h.price }));
  return new Chart(document.getElementById("hist"), {
    type: "line",
    data: { datasets: Object.entries(byStore).map(([store, pts]) => ({ label: store, data: pts, stepped: true })) },
    options: { parsing: { xAxisKey: "x", yAxisKey: "y" }, scales: { x: { type: "category", labels: [...new Set(g.history.map(h => h.observed_at))] } } },
  });
}

const id = new URLSearchParams(location.search).get("id");
fetch(`data/games/${encodeURIComponent(id)}.json`).then(r => r.json()).then(render);
</script>
</body>
</html>
