<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del juego · Radar de Ofertas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img src="logo.svg" alt="" width="28" height="28">
      Radar de Ofertas
    </a>
    <nav class="mainnav" aria-label="Principal"><a href="index.html">Ofertas</a><a href="metrics.html">Métricas</a></nav>
    <span class="updated"></span>
  </div>
</header>
<div id="hero"></div>
<main id="main"><p>Cargando…</p></main>
<footer>Precios en USD. Cada oferta enlaza a la tienda donde se obtuvo; el precio final puede cambiar en la tienda.</footer>
<script src="app.js"></script>
<script type="module">
const FORMATS = { digital: "Digital", physical: "Físico" };
const SOURCES = { steam: "Steam", gog: "GOG", xbox: "Xbox Store", playstation: "PlayStation Store", amazon: "Amazon", metacritic: "Metacritic",
                  hltb: "How Long To Beat", igdb: "IGDB", steam_users: "Usuarios de Steam" };
const STORE_COLORS = { Steam: "#4f8cff", GOG: "#a26bff", Xbox: "#22c55e", PlayStation: "#ec4899", Amazon: "#f59e0b" };
const shortDate = iso => new Date(iso).toLocaleDateString("es-CR", { day: "numeric", month: "short" });
const hours = h => (h == null ? "—" : Math.round(h) + " h");

function alsoKnown(titles) {
  if (!titles || !titles.length) return "";
  return `<div class="aka">También conocido como: ${titles.map(esc).join(" · ")}</div>`;
}

function heroHtml(g, best) {
  const low = g.historic_low ? `<span class="tag low">mínimo histórico</span>` : "";
  const chips = g.platforms.map(p => `<span class="chip">${esc(p)}</span>`).join("");
  const rating = g.rating == null ? "" : stars(g.rating, g.rating_source);
  const stores = g.store_count === 1 ? "1 tienda" : g.store_count + " tiendas";
  return `<section class="hero" style="--cover: url('${esc(g.image)}')">
    <div class="hero-inner">
      <a class="back" href="index.html">← Todas las ofertas</a>
      <div class="hero-grid">
        <div class="thumb" data-title="${esc(g.title)}"><img src="${esc(g.image)}" alt=""></div>
        <div class="hero-info">
          <h1>${esc(g.title)}</h1>
          ${alsoKnown(g.alt_titles)}
          <div class="chips">${chips}${g.kind === "game+dlc" ? '<span class="chip">Incluye DLC</span>' : ""}</div>
          <div class="hero-meta">${rating}<span>Lanzamiento: ${esc(g.release_date ?? "—")}</span></div>
          <div class="buybox">
            <div class="buy-label">Mejor precio hoy ${low}</div>
            <div class="buy-row">${priceBox(g.best_price, g.regular, g.discount_pct)}
              <a class="btn primary" href="${esc(best.url)}" target="_blank" rel="noopener">Ver en ${esc(g.best_store)} →</a></div>
            <div class="meta">MSRP ${money(g.msrp)} · Comparado en ${stores}</div>
          </div>
        </div>
      </div>
    </div>
  </section>`;
}

function offerRow(o, bestPrice) {
  const isBest = o.price === bestPrice;
  const bestTag = isBest ? `<span class="tag low">mejor precio</span>` : "";
  const chips = [o.platform, FORMATS[o.format] || o.format].filter(Boolean).map(x => `<span class="chip">${esc(x)}</span>`).join("");
  const regular = o.regular && o.regular > o.price ? `<span class="regular">${money(o.regular, o.currency)}</span>` : "";
  const color = STORE_COLORS[o.store] || "var(--muted)";
  return `<li class="offer${isBest ? " best" : ""}">
    <span class="store-dot" style="--c:${color}"></span>
    <div class="offer-main"><div class="offer-name"><b>${esc(o.store)}</b>${bestTag}</div><div class="chips">${chips}</div></div>
    <div class="offer-date meta">${shortDate(o.observed_at)}</div>
    <div class="offer-price">${regular}<b>${money(o.price, o.currency)}</b></div>
    <a class="btn small" href="${esc(o.url)}" target="_blank" rel="noopener">Ver oferta</a>
  </li>`;
}

function durationHtml(d) {
  if (!d) return `<p class="meta">Sin datos de duración.</p>`;
  const tiles = [["Historia", d.main_h], ["Con extras", d.plus_h], ["Completista", d.comp_h]]
    .map(([label, h]) => `<div class="tile"><b>${hours(h)}</b><span>${label}</span></div>`).join("");
  const source = d.source === "igdb" ? "IGDB" : "How Long To Beat";
  return `<div class="tiles">${tiles}</div><p class="meta">Fuente: ${source}</p>`;
}

function ratingRow(r) {
  const votes = r.votes ? r.votes.toLocaleString("es-CR") + " votos" : "";
  return `<div class="score-row"><span class="big-score">${Math.round(r.score)}</span>
    <div><div>${esc(SOURCES[r.source] || r.source)}</div>${stars(r.score, r.source, false)}<div class="meta">${votes}</div></div></div>`;
}

function ratingsHtml(ratings) {
  return ratings.length ? ratings.map(ratingRow).join("") : `<p class="meta">Sin calificaciones.</p>`;
}

function staleHtml(statuses) {
  const stale = statuses.filter(s => !s.ok);
  if (!stale.length) return "";
  const items = stale.map(s => "<li>" + esc(SOURCES[s.source] || s.source) + ": último dato " +
    (s.last_ok ? fmtDate(s.last_ok) : "nunca") + "</li>").join("");
  return `<section class="panel warn"><h3>Fuentes sin actualizar</h3><ul>${items}</ul></section>`;
}

// Historial: el precio de cierre de cada tienda por día, es decir, el de su última consulta
// de ese día (si una tienda tiene varias ediciones, la más barata de esa consulta).
function closingPrices(history) {
  const byStore = {};
  for (const h of history) {
    const day = h.observed_at.slice(0, 10), s = (byStore[h.store] ??= {});
    const cur = s[day];
    if (!cur || h.observed_at > cur.at) s[day] = { at: h.observed_at, price: h.price };
    else if (h.observed_at === cur.at) cur.price = Math.min(cur.price, h.price);
  }
  return byStore;
}

function historyChart(history) {
  const days = [...new Set(history.map(h => h.observed_at.slice(0, 10)))].sort((a, b) => a.localeCompare(b));
  const byStore = {};
  for (const [store, perDay] of Object.entries(closingPrices(history))) {
    byStore[store] = Object.fromEntries(Object.entries(perDay).map(([d, v]) => [d, v.price]));
  }
  const series = Object.entries(byStore).map(([store, prices]) => ({ store, values: days.map(d => prices[d] ?? null) }));
  // Tienda dibujada debajo (índice menor) con el mismo precio ese día, o -1.
  const below = (i, k) => series.findIndex((s, j) => j < i && s.values[k] != null && s.values[k] === series[i].values[k]);
  const css = getComputedStyle(document.documentElement);
  const grid = css.getPropertyValue("--line").trim(), text = css.getPropertyValue("--muted").trim();
  return new Chart(document.getElementById("hist"), {
    type: "line",
    data: {
      labels: days.map(d => shortDate(d + "T12:00:00")),
      // Todas las líneas y puntos del mismo tamaño. Donde dos tiendas tienen el mismo precio,
      // la de encima va punteada (se ve la de abajo por los huecos) y su punto es un anillo
      // relleno con el color de la de abajo. En Chart.js, menor `order` = se dibuja encima.
      datasets: series.map((s, i) => ({
        label: s.store, data: s.values, spanGaps: true, tension: 0, order: -i,
        borderColor: STORE_COLORS[s.store], backgroundColor: STORE_COLORS[s.store],
        borderWidth: 3, pointRadius: 4, pointHoverRadius: 6, pointBorderWidth: 2,
        pointBackgroundColor: ctx => {
          const j = below(i, ctx.dataIndex);
          return j < 0 ? STORE_COLORS[s.store] : STORE_COLORS[series[j].store];
        },
        segment: { borderDash: ctx => (below(i, ctx.p0DataIndex) >= 0 && below(i, ctx.p1DataIndex) >= 0 ? [6, 6] : undefined) },
      })),
    },
    options: {
      maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { position: "bottom", reverse: true,
                           labels: { color: text, usePointStyle: true, pointStyle: "circle", boxWidth: 8, boxHeight: 8 } },
                 tooltip: { callbacks: { label: c => c.dataset.label + ": " + money(c.parsed.y) } } },
      scales: { x: { grid: { color: grid }, ticks: { color: text } },
                y: { grid: { color: grid }, ticks: { color: text, callback: v => "$" + v } } },
    },
  });
}

function render(g) {
  document.title = `${g.title} · Radar de Ofertas`;
  const offers = [...g.offers].sort((a, b) => a.price - b.price);
  const rows = offers.map(o => offerRow(o, offers[0].price)).join("");
  document.getElementById("hero").innerHTML = heroHtml(g, offers[0] || {});
  document.getElementById("main").innerHTML = `
    <div class="detail-grid">
      <div>
        <section class="panel"><h3>Precios por tienda</h3><ul class="offers">${rows}</ul></section>
        <section class="panel"><h3>Historial de precios</h3><div class="chart-wrap"><canvas id="hist"></canvas></div></section>
      </div>
      <aside>
        <section class="panel"><h3>¿Cuánto dura?</h3>${durationHtml(g.duration)}</section>
        <section class="panel"><h3>Calificaciones</h3>${ratingsHtml(g.ratings)}</section>
        ${staleHtml(g.source_status)}
      </aside>
    </div>`;
  return historyChart(g.history);
}

const id = new URLSearchParams(location.search).get("id");
const res = await fetch(`data/games/${encodeURIComponent(id)}.json`);
if (res.ok) render(await res.json());
else document.getElementById("main").innerHTML = "<p>No encontramos ese juego.</p>";
</script>
</body>
</html>
