<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar de Ofertas</title>
  <meta name="description" content="Compara precios de videojuegos entre Steam, GOG, Xbox Store y Amazon, con historial de precios y mínimos históricos.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#6ea0ff" stroke-width="2"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#6ea0ff" stroke-opacity=".55" stroke-width="2"/><path d="M16 16 L16 2 A14 14 0 0 1 29.3 11.7 Z" fill="#6ea0ff" fill-opacity=".35"/><circle cx="16" cy="16" r="2.5" fill="#6ea0ff"/><circle cx="23" cy="9.5" r="2" fill="#22c55e"/></svg>
      Radar de Ofertas
    </a>
    <nav class="mainnav" aria-label="Principal"><a href="index.html" aria-current="page">Ofertas</a><a href="metrics.html">Métricas</a></nav>
    <span class="updated" id="updated"></span>
  </div>
</header>
<main>
  <section class="toolbar" aria-label="Búsqueda y orden">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Buscar un juego" aria-label="Buscar un juego">
    </div>
    <button id="filters-toggle" class="btn" type="button" aria-expanded="false" aria-controls="filters-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      Filtros <span class="badge" id="filters-count" hidden>0</span>
    </button>
    <label class="control">Ordenar por
      <select id="sort">
        <option value="discount">Mayor descuento</option>
        <option value="price">Menor precio</option>
        <option value="rating">Mejor calificación</option>
        <option value="name">Nombre (A–Z)</option>
      </select>
    </label>
  </section>

  <section id="filters-panel" class="filters-panel" aria-label="Filtros" hidden>
    <label class="control">Tipo
      <select id="kind"><option value="">Todos</option><option value="game">Juego</option><option value="game+dlc">Juego + DLC</option><option value="dlc">DLC</option><option value="other">Otro</option></select>
    </label>
    <label class="control">Plataforma
      <select id="platform"><option value="">Todas</option></select>
    </label>
    <label class="control">Formato
      <select id="format"><option value="">Todos</option><option value="digital">Digital</option><option value="physical">Físico</option></select>
    </label>
    <label class="control">Tienda
      <select id="store"><option value="">Todas</option></select>
    </label>
    <label class="control">Comparación
      <select id="compare"><option value="">Todas</option><option value="multi">En 2 tiendas o más</option><option value="single">En una sola tienda</option></select>
    </label>
    <button id="filters-clear" class="link-btn" type="button">Limpiar filtros</button>
  </section>

  <p class="result-count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <nav class="pager" aria-label="Páginas"><button id="prev" type="button">Anterior</button><span id="page"></span><button id="next" type="button">Siguiente</button></nav>
</main>
<footer>Precios en USD. Datos de Steam, GOG, Xbox Store y Amazon; calificaciones de Metacritic y de usuarios de Steam; duraciones de How Long To Beat e IGDB.</footer>
<script src="app.js"></script>
<script>
const PAGE = 24;
const FILTERS = ["kind", "platform", "format", "store", "compare"];
let all = [], page = 0;
const $ = id => document.getElementById(id);

function fillSelect(sel, values) {
  [...new Set(values)].sort((a, b) => a.localeCompare(b)).forEach(v => sel.insertAdjacentHTML("beforeend", `<option>${esc(v)}</option>`));
}

function matches(c, f) {
  return (!f.q || c.title.toLowerCase().includes(f.q)) && (!f.kind || c.kind === f.kind) &&
    (!f.platform || c.platforms.includes(f.platform)) && (!f.format || c.formats.includes(f.format)) &&
    (!f.store || c.stores.includes(f.store)) && (!f.compare || (f.compare === "multi") === (c.store_count > 1));
}

const ORDER = {
  discount: (a, b) => b.discount_pct - a.discount_pct,
  price: (a, b) => a.best_price - b.best_price,
  name: (a, b) => a.title.localeCompare(b.title),
  rating: (a, b) => (b.rating ?? -1) - (a.rating ?? -1),
};

function filtered() {
  const f = { q: $("q").value.trim().toLowerCase() };
  FILTERS.forEach(id => { f[id] = $(id).value; });
  return all.filter(c => matches(c, f)).sort(ORDER[$("sort").value]);
}

function render() {
  const list = filtered(), pages = Math.max(1, Math.ceil(list.length / PAGE));
  page = Math.min(page, pages - 1);
  $("grid").innerHTML = list.slice(page * PAGE, (page + 1) * PAGE).map(card).join("") || "<p>No hay juegos con esos filtros.</p>";
  $("count").textContent = `${list.length.toLocaleString("es-CR")} ${list.length === 1 ? "juego" : "juegos"}`;
  $("page").textContent = `Página ${page + 1} de ${pages}`;
  $("prev").disabled = page === 0;
  $("next").disabled = page >= pages - 1;
  const active = FILTERS.filter(id => $(id).value).length;
  $("filters-count").textContent = active;
  $("filters-count").hidden = active === 0;
}

$("filters-toggle").addEventListener("click", () => {
  const open = $("filters-toggle").getAttribute("aria-expanded") !== "true";
  $("filters-toggle").setAttribute("aria-expanded", String(open));
  $("filters-panel").hidden = !open;
});
$("filters-clear").addEventListener("click", () => { FILTERS.forEach(id => { $(id).value = ""; }); page = 0; render(); });
["q", ...FILTERS, "sort"].forEach(id => $(id).addEventListener("input", () => { page = 0; render(); }));
$("prev").onclick = () => { page = Math.max(0, page - 1); render(); scrollTo({ top: 0, behavior: "smooth" }); };
$("next").onclick = () => { page++; render(); scrollTo({ top: 0, behavior: "smooth" }); };

fetch("data/cards.json").then(r => r.json()).then(d => {
  all = d.cards;
  $("updated").textContent = "Actualizado: " + fmtDate(d.updated_at);
  fillSelect($("platform"), all.flatMap(c => c.platforms));
  fillSelect($("store"), all.flatMap(c => c.stores));
  render();
});
</script>
</body>
</html>
